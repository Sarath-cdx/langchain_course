[project]
name = "langgraph-course"
version = "0.1.0"
description = "LangGraph course starter"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.2",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.6.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
]
